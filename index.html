
<!DOCTYPE html>
<html lang="en">
<head>
    <title>DNA Transfer</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Enter a DNA sequence:</h1>

    <div class="container">
        <input id="DNAInput" type="text" placeholder="ATCG">
        <button id="DNASubmitButton">Submit</button>
    </div>

    <p>Complementary DNA:</p>
    <p class = "output" id="DNAOutput"> </p>

    <p>Complementary mRNA (codons):</p>
    <p class = "output" id="mRNAOutput"> </p>

    <p>Complementary tRNA (anti-codons):</p>
    <p class = "output" id="tRNAOutput"> </p>

    <p>Amino acid sequence:</p>
    <p class = "output" id="aminoAcidOutput"> </p>

    <script src="script.js"></script>

</body>
</html>
